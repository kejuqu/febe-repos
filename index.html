<!DOCTYPE html>
<html>
<head>
    <title>SSE 测试</title>
</head>
<body>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        async function connectSSE() {
            const response = await fetch('http://localhost:8080/sse', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: '19a9a0a5-df82-8f0d-8000-09145e953ddf',
                    scenario: 'SCENARIO_CHAT',
                    tools: [{ type: 'TOOL_TYPE_SEARCH', search: {} }],
                    message: {
                        parent_id: '19a9a0a5-e3b2-857d-8000-0a1441a0b4e9',
                        role: 'user',
                        blocks: [{ 
                            message_id: '', 
                            text: { content: '获取赤壁赋的内容' } 
                        }],
                        scenario: 'SCENARIO_K2',
                    },
                    options: { thinking: false },
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n\n');
                
                // 保留最后一个不完整的消息
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.trim()) {
                        try {
                            const [eventLine, dataLine] = line.split('\n');
                            const event = eventLine.replace('event: ', '');
                            const data = JSON.parse(dataLine.replace('data: ', ''));
                            
                            handleEvent(event, data);
                        } catch (e) {
                            console.error('解析错误:', e);
                        }
                    }
                }
            }
        }

        function handleEvent(event, data) {
            const div = document.createElement('div');
            
            switch (event) {
                case 'connected':
                    div.innerHTML = `<strong>连接状态:</strong> ${data.message}`;
                    break;
                case 'start':
                    div.innerHTML = `<strong>开始:</strong> ${data.message}`;
                    break;
                case 'chunk':
                    div.innerHTML = `<strong>内容:</strong> ${data.content}`;
                    break;
                case 'end':
                    div.innerHTML = `<strong>结束:</strong> ${data.message}`;
                    break;
                case 'error':
                    div.innerHTML = `<strong style="color: red;">错误:</strong> ${data.error}`;
                    break;
                default:
                    div.innerHTML = `<strong>未知事件:</strong> ${event} - ${JSON.stringify(data)}`;
            }
            
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        // 连接 SSE
        connectSSE().catch(console.error);
    </script>
</body>
</html>
